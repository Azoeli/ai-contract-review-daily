<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__ · __DATE__</title>
<style>
  /* 设计令牌 · 参考 ai-frontier（暖纸浅色系） */
  :root{
    --bg-page:#F4F3EF;
    --bg-card:#FEFEFE;
    --bg-soft:#F5F5F2;
    --bg-hover:#EEECEA;
    --border-soft:#EFEFEC;
    --border-card:#E2E1DC;
    --border-strong:#C8C7C1;
    --text-1:#1A1A18;
    --text-2:#5A5A56;
    --text-3:#6A6A66;
    --text-4:#9A9A94;
    --text-5:#B0B0A8;
    --text-6:#C0BFB8;
    --blue:#2563EB;
    --blue-mid:#3B82F6;
    --blue-soft:rgba(37,99,235,.12);
    --em-border:#6EE7B7;
    --em-bg:#ECFDF5;
    --em-text:#047857;
    --em-text-2:#059669;
    --amber-bg:#FFFBEB;
    --amber-border:#FDE68A;
    --amber-text:#B45309;
    --shadow:0 1px 4px rgba(0,0,0,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg-page);color:var(--text-1);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    font-size:14px;line-height:1.8;-webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--blue-soft);color:var(--text-1)}
  ::-webkit-scrollbar{width:5px;height:5px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#D0D0CA;border-radius:99px}
  .wrap{max-width:860px;margin:0 auto;padding:36px 20px 72px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

  /* header */
  header{margin-bottom:26px}
  .kicker{font-size:11px;color:var(--text-4);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
  h1{font-size:25px;font-weight:700;letter-spacing:-.3px;color:var(--text-1)}
  .meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
  .chip{background:var(--bg-soft);border:1px solid var(--border-soft);border-radius:999px;padding:3px 12px;font-size:11px;color:var(--text-2)}
  .chip b{color:var(--blue);font-weight:600}
  .demo-banner{margin-top:14px;background:var(--amber-bg);border:1px solid var(--amber-border);color:var(--amber-text);border-radius:12px;padding:9px 14px;font-size:12.5px}

  /* search */
  .toolbar{display:flex;gap:10px;margin-bottom:22px;align-items:center}
  .toolbar input{
    flex:1;background:var(--bg-card);border:1px solid var(--border-card);border-radius:12px;
    color:var(--text-1);padding:10px 16px;font-size:13.5px;outline:none;box-shadow:var(--shadow);
  }
  .toolbar input::placeholder{color:var(--text-5)}
  .toolbar input:focus{border-color:var(--blue-mid)}
  .toolbar .hint{font-size:11px;color:var(--text-5);white-space:nowrap}

  /* insight */
  .insight{background:var(--bg-card);border:1px solid var(--border-card);border-radius:16px;box-shadow:var(--shadow);padding:20px 22px;margin-bottom:26px}
  .insight h2{font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .insight h2::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--em-border)}
  .insight p{font-size:13.5px;color:var(--text-3);line-height:1.9}

  /* section nav */
  .sec-nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:26px}
  .sec-nav a{
    color:var(--text-4);text-decoration:none;font-size:12.5px;border-radius:999px;
    padding:5px 14px;background:var(--bg-soft);border:1px solid var(--border-soft);transition:.15s;
  }
  .sec-nav a:hover{color:var(--blue);background:var(--bg-card);border-color:var(--border-card)}

  /* section header: 标题 + 细线 + 计数胶囊 */
  section{margin-bottom:34px}
  .sec-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .sec-head .name{font-size:15px;font-weight:600;color:var(--text-1);letter-spacing:-.2px;white-space:nowrap}
  .sec-head .hairline{flex:1;height:1px;background:var(--border-soft)}
  .sec-head .cnt{font-size:11px;color:var(--text-4);background:var(--bg-soft);border:1px solid var(--border-soft);padding:2px 10px;border-radius:999px;white-space:nowrap}

  /* item card */
  .item{
    background:var(--bg-card);border:1px solid var(--border-card);border-radius:16px;
    box-shadow:var(--shadow);padding:18px 20px;margin-bottom:12px;transition:.15s;
  }
  .item:hover{border-color:var(--border-strong)}
  .item.active{border-color:var(--blue-mid);box-shadow:0 0 0 3px var(--blue-soft)}
  .item .top{display:flex;gap:10px;align-items:flex-start}
  .item .rank{font-size:10px;color:var(--text-6);min-width:22px;padding-top:4px}
  .item a.title{
    color:var(--text-1);text-decoration:none;font-weight:600;font-size:14.5px;line-height:1.5;flex:1;
  }
  .item a.title:hover{color:var(--blue)}
  .item .impact{display:flex;align-items:center;gap:6px;white-space:nowrap;padding-top:4px}
  .item .impact .bar{width:52px;height:4px;border-radius:99px;background:#E8E7E3;overflow:hidden}
  .item .impact .bar i{display:block;height:100%;border-radius:99px;background:var(--blue-mid)}
  .item .impact .num{font-size:10px;color:var(--text-4)}
  .item .summary{font-size:13px;color:var(--text-3);line-height:1.8;margin:8px 0 0 32px}
  .item .tip{
    border-left:3px solid var(--em-border);background:var(--em-bg);border-radius:0 12px 12px 0;
    padding:8px 14px;font-size:12px;color:var(--em-text);line-height:1.75;margin:10px 0 0 32px;
  }
  .item .tip b{color:var(--em-text-2);font-weight:600}
  .item .foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0 0 32px}
  .tag{
    background:var(--bg-soft);border:1px solid var(--border-soft);border-radius:999px;
    padding:1px 9px;font-size:10px;color:var(--text-5);
  }
  .src{font-size:11px;color:var(--blue-mid);text-decoration:none;font-weight:500;margin-left:auto}
  .src:hover{color:var(--blue);text-decoration:underline;text-underline-offset:2px}
  .date-str{font-size:11px;color:var(--text-5)}
  .hidden{display:none}

  footer{
    margin-top:44px;padding-top:18px;border-top:1px solid var(--border-soft);
    color:var(--text-5);font-size:11px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
  }
  footer a{color:var(--text-4);text-decoration:none}
  footer a:hover{color:var(--blue)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker mono">Daily Digest · Auto Generated</div>
    <h1 id="site-title"></h1>
    <div class="meta-row" id="meta-row"></div>
    <div class="demo-banner hidden" id="demo-banner">演示数据 · 条目为示例内容，仅用于展示页面效果</div>
  </header>

  <div class="toolbar">
    <input id="search" type="text" placeholder="搜索标题 / 摘要 / 标签 / 来源…" autocomplete="off">
    <span class="hint mono">j/k 导航 · Enter 打开 · / 搜索</span>
  </div>

  <div class="insight" id="insight-box">
    <h2>今日洞见</h2>
    <p id="insight-text"></p>
  </div>

  <div class="sec-nav" id="sec-nav"></div>
  <main id="main"></main>

  <footer>
    <span class="mono" id="footer-left"></span>
    <span class="mono"><a href="archive.html">历史归档</a></span>
  </footer>
</div>

<script>
const DATA = __DATA__;

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- header ----
document.getElementById("site-title").textContent = DATA.meta.title;
const total = DATA.sections.reduce((n,s)=>n+s.items.length,0);
document.getElementById("meta-row").innerHTML =
  `<span class="chip mono">${esc(DATA.meta.date)}</span>`+
  `<span class="chip">栏目 <b>${DATA.sections.length}</b></span>`+
  `<span class="chip">条目 <b>${total}</b></span>`+
  `<span class="chip">信源命中 <b>${(DATA.sources_hit||[]).length}</b></span>`;
if(DATA.meta.demo) document.getElementById("demo-banner").classList.remove("hidden");
document.getElementById("insight-text").textContent = DATA.insight || "今日无综合洞见。";
document.getElementById("footer-left").textContent =
  `${DATA.meta.title} · ${DATA.meta.generator||"QoderWork cron 自动生成"}`;

// ---- sections ----
const main = document.getElementById("main");
const nav = document.getElementById("sec-nav");
let allItems = [];
DATA.sections.forEach(sec=>{
  nav.insertAdjacentHTML("beforeend",`<a href="#${esc(sec.id)}">${esc(sec.name)} · ${sec.items.length}</a>`);
  const el = document.createElement("section");
  el.id = sec.id;
  el.innerHTML = `<div class="sec-head"><span class="name">${esc(sec.name)}</span><span class="hairline"></span><span class="cnt mono">${sec.items.length} 条</span></div>`;
  sec.items.forEach(it=>{
    const score = it.score||0;
    const tags = (it.tags||[]).map(t=>`<span class="tag mono">${esc(t)}</span>`).join("");
    const tip = it.legal_tip ? `<div class="tip"><b>法务启示</b> · ${esc(it.legal_tip)}</div>` : "";
    el.insertAdjacentHTML("beforeend", `
      <div class="item" data-search="${esc((it.title+" "+it.summary+" "+(it.tags||[]).join(" ")+" "+it.source).toLowerCase())}">
        <div class="top">
          <span class="rank mono">${String(it.rank).padStart(2,"0")}</span>
          <a class="title" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>
          <span class="impact" title="影响力评分">
            <span class="bar"><i style="width:${score*20}%"></i></span>
            <span class="num mono">${score}/5</span>
          </span>
        </div>
        <div class="summary">${esc(it.summary)}</div>
        ${tip}
        <div class="foot">${tags}
          <span class="date-str mono">${it.published?esc(it.published):""}</span>
          <a class="src" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.source)} ↗</a>
        </div>
      </div>`);
  });
  main.appendChild(el);
});
allItems = Array.from(document.querySelectorAll(".item"));

// ---- search ----
const searchBox = document.getElementById("search");
function applyFilter(){
  const q = searchBox.value.trim().toLowerCase();
  allItems.forEach(el=>el.classList.toggle("hidden", q && !el.dataset.search.includes(q)));
  document.querySelectorAll("section").forEach(sec=>{
    const visible = sec.querySelectorAll(".item:not(.hidden)").length;
    sec.classList.toggle("hidden", visible===0);
  });
}
searchBox.addEventListener("input",applyFilter);

// ---- keyboard nav ----
let cursor = -1;
function move(delta){
  const visible = allItems.filter(el=>!el.classList.contains("hidden"));
  if(!visible.length) return;
  if(cursor>=0 && visible[cursor]) visible[cursor].classList.remove("active");
  cursor = (cursor + delta + visible.length) % visible.length;
  const el = visible[cursor];
  el.classList.add("active");
  el.scrollIntoView({block:"nearest",behavior:"smooth"});
}
document.addEventListener("keydown",e=>{
  if(e.target===searchBox){
    if(e.key==="Escape"){searchBox.blur();e.preventDefault();}
    return;
  }
  if(e.key==="/"){e.preventDefault();searchBox.focus();return;}
  if(e.key==="j"||e.key==="ArrowDown"){e.preventDefault();move(1);}
  if(e.key==="k"||e.key==="ArrowUp"){e.preventDefault();move(-1);}
  if(e.key==="Enter"&&cursor>=0){
    const visible = allItems.filter(el=>!el.classList.contains("hidden"));
    const a = visible[cursor] && visible[cursor].querySelector("a.title");
    if(a) window.open(a.href,"_blank","noopener");
  }
});
</script>
</body>
</html>
