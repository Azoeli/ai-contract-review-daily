# =============================================================
# pages.yml — 必需工作流：推送即部署
#
# 任何对 data/digests/*.json 的提交推送到 main 后，
# 自动运行 build_site.py 生成静态站点并发布到 GitHub Pages。
#
# 前置设置（仓库 Settings -> Pages -> Source 选择 "GitHub Actions"）。
# =============================================================
name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build static site from data/digests/*.json
        run: python3 scripts/build_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
